CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SENSOR=y
CONFIG_QEIV2_HPMICRO=y
CONFIG_MIRACZV_MOTOR_TB6612=y
CONFIG_MIRACZV_ENCODER=y
CONFIG_MIRACZV_HID_HOST=y

CONFIG_MIRACZV_WHEELBASE_MM=300
CONFIG_MIRACZV_TRACK_WIDTH_MM=150
CONFIG_MIRACZV_WHEEL_RADIUS_MM=32
CONFIG_MIRACZV_MAX_LINEAR_MPS=1000
CONFIG_MIRACZV_MAX_ANGULAR_MRADPS=3142

# Right stick: horizontal steers, vertical controls forward/reverse.
CONFIG_MIRACZV_HID_RIGHT_STICK_Z_RZ=y
CONFIG_MIRACZV_HID_INVERT_THROTTLE=y
CONFIG_MIRACZV_HID_INVERT_STEERING=y

CONFIG_USB_HOST_STACK=y
CONFIG_HPMICRO_USB_ROLE_HOST=y
CONFIG_UHC_HPMICRO=y
CONFIG_UHC_BUF_COUNT=16
CONFIG_UHC_BUF_POOL_SIZE=2048
CONFIG_USBH_USB_DEVICE_HEAP=2048

CONFIG_CPP=n
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_FLOAT_HARD=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_ASSERT=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
CONFIG_HW_STACK_PROTECTION=y
